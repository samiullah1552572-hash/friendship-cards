<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Design, save and print personalised friendship cards.">
<title>Friendship Card Studio</title>
<style>
:root {
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  color: #20322f;
  background: #f5f6f0;
  --green: #235749;
  --dark: #194335;
  --muted: #566961;
  --border: #dbe4db;
  --panel: #fff;
  --pale: #edf4ee;
  --shadow: 0 5px 24px #243b2710;
  line-height: 1.5;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 300px; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: wait; opacity: .55; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #519783; outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
.topbar { background: #fcfdf8; border-bottom: 1px solid var(--border); }
.top-inner, .shell { max-width: 1540px; padding-inline: clamp(16px, 3.45vw, 52px); margin-inline: auto; }
.top-inner { display: flex; justify-content: space-between; align-items: center; gap: 14px; min-height: 72px; }
.brand { color: var(--dark); display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-size: 17px; font-weight: 800; white-space: nowrap; }
.brand-mark { inline-size: 35px; block-size: 35px; display: grid; place-items: center; background: #e3efe4; border-radius: 10px; }
.brand-muted { font-weight: 500; }
.top-actions, .export-actions, .library-actions { display: flex; align-items: center; gap: 8px; }
.save-status { color: var(--muted); font-size: 12px; padding-inline: 7px; }
.save-status::before { content: '●'; color: #589679; margin-inline-end: 6px; font-size: 8px; vertical-align: 2px; }
.save-status[data-error]::before { color: #a33947; }
.button, .icon-button { border: 1px solid transparent; background: transparent; color: var(--green); display: inline-flex; justify-content: center; align-items: center; gap: 8px; border-radius: 9px; font-size: 13px; font-weight: 700; min-height: 38px; padding: 8px 12px; line-height: 1.3; }
.button svg, .icon-button svg, .brand-mark svg, .size-label svg { width: 17px; height: 17px; flex: none; }
.icon-button { min-width: 36px; padding: 7px; border-color: var(--border); }
.primary { background: var(--green); color: #fff; border-color: var(--green); }
.primary:hover { background: var(--dark); }
.quiet:hover, .icon-button:hover { background: var(--pale); }
.secondary { background: #fff; border-color: var(--border); }
.secondary:hover { background: #f3f7f2; }
.danger { color: #9a394c; }
.shell { padding-block: 36px 22px; }
.intro { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 29px; }
.eyebrow { color: #477261; font-size: 10px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
.intro h1 { color: #1b382f; font-family: Georgia, 'Segoe UI', serif; font-weight: 500; font-size: clamp(29px, 4.1vw, 57px); line-height: 1.13; letter-spacing: -.038em; margin: 6px 0 8px; }
.intro p, .panel-head p { color: var(--muted); font-size: 13px; }
.intro .primary { padding: 11px 16px; white-space: nowrap; }
.workspace { display: grid; grid-template-columns: minmax(175px, .83fr) minmax(360px, 2.6fr) minmax(235px, 1.1fr); align-items: start; gap: 16px; }
.panel { min-width: 0; background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 16px; }
.panel-head { padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.panel-head h2 { font-size: 16px; font-weight: 750; overflow-wrap: anywhere; }
.panel-head p { margin-top: 3px; font-size: 12px; }
.library-list { padding: 0 10px 10px; display: grid; gap: 5px; max-height: 500px; overflow: auto; }
.library-item { width: 100%; text-align: start; display: flex; gap: 10px; align-items: center; border: 1px solid transparent; background: transparent; border-radius: 9px; padding: 9px 7px; color: inherit; }
.library-item:hover { background: #f5f8f4; }
.library-item[aria-current="true"] { background: var(--pale); border-color: #d4e5d7; }
.thumb { flex: 0 0 49px; height: 33px; border: 1px solid #bfcdc2; border-radius: 6px; display: grid; place-items: center; }
.thumb svg { width: 19px; height: 19px; }
.item-copy { min-width: 0; }
.item-copy strong, .item-copy small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.item-copy strong { color: #243a30; font-size: 12px; }
.item-copy small { color: var(--muted); font-size: 11px; margin-top: 3px; }
.library-actions { border-top: 1px solid var(--border); padding: 9px 7px; flex-wrap: wrap; }
.library-actions .button { padding-inline: 7px; font-size: 11px; }
.library-actions .button svg { width: 14px; height: 14px; }
.canvas-title { min-width: 0; }
.canvas-title .eyebrow { margin-bottom: 3px; }
.canvas-title h2 { font-size: 18px; }
.segmented { display: flex; padding: 3px; background: #f1f5ef; border-radius: 9px; gap: 1px; flex: none; }
.segmented button { min-width: 42px; white-space: nowrap; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--muted); padding: 5px 8px; min-height: 29px; font-size: 11px; font-weight: 700; }
.segmented button[aria-pressed="true"] { background: #fff; color: var(--green); border-color: #dae5da; box-shadow: 0 1px 3px #21462b12; }
.artboard { padding: clamp(14px, 2.35vw, 36px); min-height: 325px; display: grid; align-content: center; justify-items: center; gap: 25px; background-color: #edf2ea; background-image: radial-gradient(#a4b6a787 1px, transparent 1px); background-size: 17px 17px; border-block: 1px solid #e1e8df; }
.artboard.two-up { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.preview-side { margin: 0; width: 100%; max-width: 780px; min-width: 0; }
.preview-side svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 9px 13px #182b2442); }
.preview-side figcaption { margin-top: 9px; text-align: center; color: #405c50; font-size: 11px; font-weight: 700; }
.canvas-footer { padding: 11px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.size-label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; white-space: nowrap; direction: ltr; }
.editor-tabs { display: flex; border-block: 1px solid var(--border); padding: 0 11px; }
.editor-tabs button { flex: 1; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; padding: 10px 4px; }
.editor-tabs button[aria-pressed="true"] { border-bottom-color: var(--green); color: var(--green); }
.editor { padding: 15px; }
.editor label, .field-label { display: block; margin-bottom: 5px; color: #3e534a; font-size: 12px; font-weight: 700; }
.field { margin-bottom: 12px; min-width: 0; }
.field:last-child { margin-bottom: 0; }
.field input:not([type="checkbox"]), .field select, .field textarea { width: 100%; min-width: 0; border: 1px solid #cfdcd2; border-radius: 7px; color: #253b31; background: #fcfdfb; font-size: 13px; padding: 7px 8px; }
.field textarea { resize: vertical; min-height: 66px; }
.field input[type="color"] { height: 39px; padding: 3px; }
.field input[type="range"] { padding: 0; accent-color: var(--green); }
.field input[type="checkbox"] { accent-color: var(--green); }
.field .check-label { display: flex; align-items: center; gap: 8px; }
.field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.edit-note, .modal-description { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.field-detail { margin-top: 13px; border-top: 1px solid var(--border); padding-top: 12px; }
.field-detail summary { cursor: pointer; margin-bottom: 12px; font-size: 12px; font-weight: 700; }
.swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 13px; }
.swatch { border: 1px solid var(--border); border-radius: 8px; background: #fff; padding: 6px 2px; font-size: 10px; font-weight: 650; color: #2b4439; }
.swatch i { display: block; width: 21px; height: 21px; border-radius: 50%; border: 1px solid #788c7b80; margin: 0 auto 4px; }
.swatch[aria-pressed="true"] { background: var(--pale); outline: 1px solid var(--green); }
.photo-file { width: 100%; margin-bottom: 9px; color: var(--muted); font-size: 12px; }
.photo-file::file-selector-button { padding: 6px 8px; border: 1px solid var(--border); color: var(--green); font: inherit; background: #fff; border-radius: 6px; margin-inline-end: 8px; }
.footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 12px; color: var(--muted); font-size: 12px; }
dialog { width: min(540px, calc(100% - 28px)); max-height: calc(100dvh - 30px); overflow: auto; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 24px 75px #152a274d; color: inherit; padding: 0; }
dialog::backdrop { background: #142c266b; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 17px 19px; border-bottom: 1px solid var(--border); gap: 16px; }
.modal-head h2 { font-size: 19px; }
.modal-body { padding: 18px 19px; }
.modal-options { display: grid; gap: 8px; margin-bottom: 12px; }
.option { padding: 10px 12px; text-align: start; border: 1px solid var(--border); background: #fff; color: var(--green); border-radius: 8px; display: flex; align-items: center; gap: 12px; }
.option:hover { background: var(--pale); }
.option strong, .option small { display: block; }
.option strong { font-size: 13px; }
.option small { color: var(--muted); font-size: 12px; margin-top: 2px; }
.option svg { width: 22px; height: 22px; flex: none; }
.modal-buttons { display: flex; gap: 8px; justify-content: end; flex-wrap: wrap; }
.gallery-modal { width: min(860px, calc(100% - 28px)); }
.gallery-modal .modal-head { position: sticky; top: 0; background: white; z-index: 1; }
.template-gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.template-filters { display: grid; grid-template-columns: 1.35fr 1fr; gap: 10px; margin-bottom: 15px; }
.template-filters .field { margin: 0; }
.template-filters label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 12px; font-weight: 700; }
.template-size { display: block; margin-top: 5px; color: var(--green); font-size: 10px; font-weight: 700; }
.swap-button { margin-block-end: 13px; width: 100%; }
.template-option { display: flex; flex-direction: column; width: 100%; min-width: 0; background: #fff; color: inherit; border: 1px solid var(--border); border-radius: 11px; padding: 7px; text-align: start; }
.template-option:hover { background: #f4f8f3; border-color: #8daf9c; }
.template-thumb { display: block; aspect-ratio: 1200 / 757; overflow: hidden; width: 100%; border-radius: 7px; background: #f3f5f1; }
.template-option:not([data-format="formatID"]) .template-thumb { padding: 6px; }
.template-thumb > svg { display: block; width: 100%; height: 100%; }
.template-blank { height: 100%; display: grid; place-items: center; color: #507666; }
.template-blank svg { width: 28px; height: 28px; }
.template-copy { display: block; padding: 7px 4px 3px; }
.template-copy strong, .template-copy small { display: block; }
.template-copy strong { color: var(--dark); font-size: 13px; }
.template-copy small { margin-block-start: 2px; color: var(--muted); font-size: 11px; }
.pair-option { margin-block-start: 13px; }
.pair-option .option { width: 100%; }
@media (max-width: 610px) { .template-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } }
.help-list { padding-inline-start: 22px; font-size: 13px; }
.help-list li { margin-bottom: 9px; }
#toast { position: fixed; z-index: 10; inset-block-end: 18px; inset-inline-start: 50%; translate: -50% 0; background: #234e41; color: #fff; padding: 11px 16px; border-radius: 9px; width: max-content; max-width: calc(100vw - 24px); box-shadow: 0 4px 19px #213c3080; font-size: 13px; }
[dir="rtl"] #toast { translate: 50% 0; }
[dir="rtl"] .intro h1 { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; letter-spacing: 0; line-height: 1.5; }
[dir="rtl"] .eyebrow { letter-spacing: 0; }
.brand { direction: ltr; }
#print-output { display: none; }
@media (max-width: 1010px) {
  .workspace { grid-template-columns: minmax(0, 1.8fr) minmax(222px, 1fr); }
  .library { grid-column: 1 / -1; display: flex; align-items: center; }
  .library .panel-head { padding: 10px; }
  .library-list { display: flex; flex: 1; overflow-x: auto; padding-block: 7px; }
  .library-item { min-width: 145px; }
  .library-actions { border-top: 0; }
}
@media (max-width: 650px) {
  .top-inner { min-height: 59px; gap: 8px; }
  .top-actions { gap: 1px; }
  .top-actions .button { padding-inline: 6px; font-size: 11px; }
  .top-actions .button svg, .save-status { display: none; }
  .brand { font-size: 13px; gap: 6px; }
  .brand-mark { inline-size: 28px; block-size: 28px; }
  .shell { padding-block-start: 23px; }
  .intro { align-items: flex-start; flex-direction: column; margin-bottom: 16px; }
  .workspace { display: flex; flex-direction: column; gap: 12px; }
  .panel { width: 100%; }
  .library { flex-wrap: wrap; }
  .library .panel-head { width: 100%; }
  .library-list { flex-basis: 100%; padding-top: 0; }
  .library-actions { padding: 2px 8px 6px; }
  .canvas-head { padding: 11px; }
  .artboard { min-height: 0; }
  .footer { align-items: start; }
}
@page { size: A4 portrait; margin: 0; }
@media print {
  :root, body { background: #fff; }
  body > :not(#print-output) { display: none !important; }
  #print-output { display: block; direction: ltr; }
  .print-sheet { width: 210mm; height: 297mm; position: relative; overflow: hidden; break-after: page; }
  .print-sheet:last-child { break-after: auto; }
  .print-card { position: absolute; }
  .print-marks { position: absolute; inset: 0; width: 100%; height: 100%; }
  .print-card svg { width: 100%; height: 100%; display: block; }
  .print-note { position: absolute; top: 270mm; left: 12mm; right: 12mm; color: #3f594d; font: 9pt Arial, sans-serif; }
  * { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
}

.pro-toolbar { display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:0 14px 10px; }
.pro-toolbar .button { min-height:32px;padding:5px 8px;font-size:11px; }
.pro-undo-group { display:flex;gap:2px; }
#pro-direct[aria-pressed="true"] { background:#e4f0e7;border-color:#85a997; }
.pro-hint { padding:7px 14px;background:#edf5eb;border-top:1px solid #d5e3d7;font-size:12px;color:#335c4e; }
.direct-mode [data-layer] { cursor:grab;touch-action:none; }
.direct-mode [data-layer]:hover,.direct-mode [data-layer]:focus-visible { filter:drop-shadow(0 0 2px #1f7e65);outline:1px dashed #266b52; }
.direct-mode [data-layer]:active { cursor:grabbing; }
.preview-side { position:relative; }
.drag-guides::before,.drag-guides::after { content:'';position:absolute;z-index:2;pointer-events:none;opacity:.8; }
.drag-guides::before { width:100%;left:0;top:50%;border-top:1px dashed #178066; }
.drag-guides::after { height:100%;top:0;left:50%;border-left:1px dashed #178066; }
#pro-tools { background:#235747;color:white;border-color:#235747; }
#pro-tools:hover { background:#194438; }
#pro-tools svg { width:14px;height:14px; }
.pro-tool-gallery { width:min(940px,calc(100% - 28px)); }
.pro-tool-gallery .modal-head { position:sticky;top:0;background:#fff;z-index:3; }
.pro-tool-gallery .modal-body { padding:20px 23px 24px; }
.studio-tools-intro { display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted); }
.tool-current { border-radius:5px;background:#e9f3e9;color:#355a4a;padding:5px 9px;font-size:12px;overflow-wrap:anywhere; }
.tool-current bdi { font-weight:750;margin-inline:4px; }
.tool-section { margin-top:21px; }
.tool-section h3 { font-size:14px;font-weight:760;color:var(--dark);margin-bottom:9px; }
.pro-tools-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px; }
@media(min-width:840px) { .tool-section[aria-labelledby="group-toolsEdit"] .pro-tools-grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }
.studio-tool-card { position:relative;display:grid;align-content:start;min-width:0;border:1px solid #dbe5dd;border-radius:12px;background:#fff;text-align:start;padding:7px;color:#203a31; }
.studio-tool-card:hover { border-color:#8eab9a;box-shadow:0 3px 10px #244b3020;background:#fcfefb; }
.tool-picture { display:grid;place-items:center;min-width:0;border-radius:8px;min-height:77px;color:var(--tone-ink);background-color:var(--tone-bg);background-image:radial-gradient(var(--tone-dot) 1px,transparent 1px);background-size:12px 12px; }
.tool-picture svg { width:115px;height:76px;max-width:100%; }
.tool-picture .tool-paper { fill:#fffdfb; }
.tool-picture .tool-solid { fill:currentColor;stroke:none; }
.tool-picture .tool-tint { fill:var(--tone-fill); }
.tone-rose { --tone-ink:#974b67;--tone-bg:#f8eaf0;--tone-fill:#ebc4d3;--tone-dot:#dcb9c9; }
.tone-lilac { --tone-ink:#6c568b;--tone-bg:#f0eafa;--tone-fill:#dcd0ef;--tone-dot:#cdc1e1; }
.tone-sky { --tone-ink:#376884;--tone-bg:#e9f3fa;--tone-fill:#c8e1ef;--tone-dot:#b9d5e5; }
.tone-mint { --tone-ink:#356653;--tone-bg:#e9f4ed;--tone-fill:#cbe6d6;--tone-dot:#bad6c7; }
.tone-amber { --tone-ink:#875f32;--tone-bg:#fbf1e4;--tone-fill:#efd8b6;--tone-dot:#e3cbae; }
.studio-tool-copy { display:grid;gap:4px;padding:8px 19px 5px 4px;padding-inline:4px 20px; }
.studio-tool-copy strong { font-size:13px;line-height:1.32;font-weight:760; }
.studio-tool-copy small { color:#51645b;font-size:11.5px;line-height:1.38; }
.tool-card-arrow { position:absolute;inset-inline-end:10px;bottom:10px;font-size:20px;font-weight:500;line-height:1;color:var(--green); }
[dir="rtl"] .tool-card-arrow,[dir="rtl"] .tool-back-arrow { transform:scaleX(-1); }
.pro-tool-detail .tool-back { min-height:30px;padding:4px 7px;margin:0 0 10px; }
.tool-guide { display:grid;grid-template-columns:100px 1fr;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;padding:7px;margin-bottom:16px; }
.tool-guide .tool-picture { min-height:58px; }
.tool-guide svg { height:57px;width:85px; }
.tool-guide p { color:#2c4338;font-size:13px;line-height:1.45; }
.tool-guide small { display:block;color:#537266;font-size:11px;margin-top:4px; }
#modal-title:focus { outline:none; }
@media(max-width:740px) { .pro-tools-grid {grid-template-columns:repeat(2,minmax(0,1fr));} }
@media(max-width:490px) {
  .pro-tool-gallery .modal-body { padding:13px; }
  .studio-tools-intro { font-size:13px; }
  .pro-tools-grid { grid-template-columns:1fr;gap:7px; }
  .studio-tool-card { grid-template-columns:88px 1fr;align-items:center; }
  .studio-tool-card .tool-picture { min-height:62px; }
  .studio-tool-card .tool-picture svg { height:61px; }
  .studio-tool-copy { padding-inline:9px 17px; }
}
.pro-fullscreen { width:min(1330px,calc(100% - 18px));height:calc(100dvh - 20px);max-height:none; }
.pro-fullscreen .modal-head { position:sticky;top:0;z-index:1;background:white; }
.pro-full-view { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:16px;background:#edf4ec;padding:14px;border-radius:12px; }
.pro-full-view figure { margin:0;text-align:center; }
.pro-full-view svg { max-width:100%;max-height:70vh;height:auto; }
.pro-full-view figcaption { color:var(--muted);font-size:12px;padding-top:8px; }
@media(max-width:620px) { .pro-full-view {grid-template-columns:1fr;} }
.pro-shelf { display:grid;gap:8px;max-height:300px;overflow:auto;margin-bottom:12px; }
.pro-shelf-row { display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:7px;border:1px solid var(--border);border-radius:7px; }
.pro-shelf-row > span { min-width:85px;flex:1;overflow-wrap:anywhere;font-size:13px; }
.pro-shelf-row small { display:block;color:var(--muted); }
.pro-shelf-row .button { min-height:29px;font-size:11px;padding:4px 6px; }
.proof-surface {position:fixed;left:-12000px;top:0;visibility:hidden;pointer-events:none;}
.proof-bleed { margin-top:12px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="top-inner">
    <a class="brand" href="#studio" aria-label="Friendship Card Studio"><span class="brand-mark" data-icon="heart"></span><span>Friendship<span class="brand-muted"> Studio</span></span></a>
    <div class="top-actions">
      <span class="save-status" id="save-status" role="status"></span>
      <button type="button" class="button quiet" id="language" aria-label="Switch language">اردو</button>
      <button type="button" class="button quiet" id="import" data-icon="upload" data-i="import"></button>
      <button type="button" class="button secondary" id="project" data-icon="folder" data-i="project"></button>
    </div>
  </div>
</header>
<main id="studio" class="shell">
  <section class="intro" aria-labelledby="page-title">
    <div><div class="eyebrow" data-i="workspace"></div><h1 id="page-title" data-i="headline"></h1><p data-i="intro"></p></div>
    <button type="button" class="button primary" id="new-card" data-icon="plus" data-i="newCard"></button>
  </section>

	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;

	isDark : function(row, col) {

	make : function() {

				var totalDataCount = 0;

				}

					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}

					break;
			}

		}

		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);

		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}

	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);

			if (this.modules[6][c] !== null) {

			}

		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {

						} else {

						}
					}
				}
			}
		}

	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);

		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);

	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {

						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}

						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var maxEcCount = 0;

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;

		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}

	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

function id() {
  return Array.from(crypto.getRandomValues(new Uint8Array(10)), byte => byte.toString(16).padStart(2, '0')).join('');
}

function fresh(template = 'license') {
  const content = templates[template];
  return {
    ...Object.fromEntries(Object.keys(textFields).map(key => [key, ''])),
    format: 'formatID', customWidth: 100, customHeight: 100, squareCorners: false, punchGuide: false,
    ...(template === 'license' ? labelDefaults : {}), ...content,
    id: id(), template, owner: '', friend: '', customColor: '#397766', font: content.font || 'sans',
    showArt: template !== 'blank', showStamp: template === 'license', showCode: template === 'license',
    photos: { front: null, back: null },
    stripPhotos: { front: [null, null], back: [null, null] }, pro: cleanPro(null)
  };
}

// Checksums identify the two earlier sample pairs without embedding their names in the published file.
const formerSampleLabels = [
  new Set([0x2044a203, 0x6de55284]),
  new Set([0x57b1dbd8, 0xe4a71af1])
];

function refreshUntouchedSamples(cards) {
  const samples = starterCards();
  const matchingSample = (card, sample) => Object.keys(sample).every(key => {
    if (['id', 'owner', 'friend'].includes(key)) return true;
    if (key === 'photos') return !card.photos.front && !card.photos.back;
    if (key === 'stripPhotos') return ['front', 'back'].every(side => !card.stripPhotos[side].some(Boolean));
    if (key === 'pro') return JSON.stringify(card.pro) === JSON.stringify(sample.pro);
    return card[key] === sample[key];
  });
  return cards.map(card => {
    const labelSignature = crc32(encoder.encode(card.owner + '\0' + card.friend));
    const index = samples.findIndex((sample, slot) => formerSampleLabels[slot].has(labelSignature) && matchingSample(card, sample));
    return index < 0 ? card : { ...card, owner: starterLabels[index], friend: starterLabels[1 - index] };
  });
}

const bounded = (value, low, high, fallback) => Number.isFinite(value) ? Math.max(low, Math.min(high, value)) : fallback;

function cleanPhoto(value) {
  const photo = typeof value === 'string' ? { data: value } : value;
  if (!photo || typeof photo.data !== 'string' || !/^data:image\/(?:png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(photo.data)) return null;
  if (photo.data.length > 12_000_000) throw new Error('Photo too large');
  return { data: photo.data, width: bounded(photo.width, 1, 20000, 0), height: bounded(photo.height, 1, 20000, 0),
    zoom: bounded(photo.zoom, 1, 3, 1), x: bounded(photo.x, -100, 100, 0), y: bounded(photo.y, -100, 100, 0) };
}

function cleanCard(value) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('Invalid card');
  const template = Object.hasOwn(templates, value.template) ? value.template : 'license';
  const card = fresh(template);
  if (typeof value.id === 'string' && /^[a-zA-Z0-9-]{1,64}$/.test(value.id)) card.id = value.id;
  for (const [key, max] of Object.entries(textFields)) if (typeof value[key] === 'string') card[key] = value[key].slice(0, max);
  if (Object.hasOwn(palettes, value.theme) || value.theme === 'custom') card.theme = value.theme;
  if (typeof value.customColor === 'string' && /^#[\da-f]{6}$/i.test(value.customColor)) card.customColor = value.customColor;
  if (layouts.includes(value.layout)) card.layout = value.layout;
  if (Object.hasOwn(formats, value.format) || value.format === 'formatCustom') card.format = value.format;
  card.customWidth = bounded(value.customWidth, ...customLimits.width, card.customWidth);
  card.customHeight = bounded(value.customHeight, ...customLimits.height, card.customHeight);
  if (['sans', 'serif'].includes(value.font)) card.font = value.font;
  for (const key of ['showArt', 'showStamp', 'showCode', 'squareCorners', 'punchGuide']) if (typeof value[key] === 'boolean') card[key] = value[key];
  for (const side of ['front', 'back']) {
    card.photos[side] = cleanPhoto(value.photos?.[side]);
    card.stripPhotos[side] = [0, 1].map(index => cleanPhoto(value.stripPhotos?.[side]?.[index]));
  }
  card.pro = cleanPro(value.pro);
  if (card.pro.folded && dimensions(card)[0] > 95) card.pro.folded = false;
  return card;
}

function legacyCards(legacy) {
  if (!legacy || typeof legacy.nameA !== 'string' || typeof legacy.nameB !== 'string') throw new Error('Invalid legacy file');
  const themes = { blue: 'sky', lilac: 'lavender', rose: 'rose', mint: 'mint' };
  const mapping = { heading: 'title', subtitle: 'subtitle', level: 'level', licenseType: 'kind', issued: 'issued', expiry: 'valid', caption: 'caption',
    quote: 'frontFooter', codeTitle: 'frontListTitle', rules: 'frontRules', seal: 'stamp', backHeading: 'backTitle', backSubtitle: 'backSubtitle',
    noteTitle: 'noteTitle', backPromisesTitle: 'backListTitle', backRules: 'backRules', backQuote: 'backFooter' };
  return [0, 1].map(i => {
    const letter = i ? 'B' : 'A', other = i ? 'A' : 'B';
    const card = { ...fresh(), owner: legacy['name' + letter], friend: legacy['name' + other], theme: themes[legacy['theme' + letter]] || (i ? 'lavender' : 'sky') };
    for (const key of Object.keys(labelDefaults)) if (typeof legacy[key] === 'string') card[key] = legacy[key];
    for (const [oldKey, newKey] of Object.entries(mapping)) if (typeof legacy[oldKey] === 'string') card[newKey] = legacy[oldKey];
    if (typeof legacy['backNote' + letter] === 'string') card.note = legacy['backNote' + letter];
    if (typeof legacy['signature' + letter] === 'string') card.ownerSig = legacy['signature' + letter];
    if (typeof legacy['signature' + other] === 'string') card.friendSig = legacy['signature' + other];
    card.photos.front = legacy.photos?.[i];
    return cleanCard(card);
  });
}

function line(x, y, value, width, size, options = {}) {

  const natural = measure.measureText(label).width + Math.max(0, [...label].length - 1) * spacing;
  const scale = natural > width ? width / natural : 1;
  const rtl = options.direction === 'rtl' || (options.direction !== 'ltr' && /^[^\p{L}]*[\p{Script=Arabic}\p{Script=Hebrew}]/u.test(label));

function wrap(value, width, size, font) {
  measure.font = `500 ${size}px ${font}`;
  const rows = [];
  for (const paragraph of String(value).split('\n')) {
    let current = '';
    for (const word of paragraph.trim().split(/\s+/).filter(Boolean)) {
      const attempt = current ? current + ' ' + word : word;
      if (measure.measureText(attempt).width <= width) { current = attempt; continue; }
      if (current) rows.push(current);
      current = '';
      for (const glyph of word) {
        if (current && measure.measureText(current + glyph).width > width) { rows.push(current); current = ''; }
        current += glyph;
      }
    }
    rows.push(current);
  }
  return rows;
}

function paragraph(x, y, value, width, size, count, rowHeight, options) {
  if (!value) return '';
  const content = value.trim().replace(/\n{3,}/g, '\n\n');
  let rows = wrap(content, width, size, options.font);
  while (rows.length > count && size > 17) rows = wrap(content, width, --size, options.font);
  if (rows.length > count) rows = wrap(content.replace(/\s+/g, ' '), width, size, options.font);
  if (rows.length > count) {
    rows = rows.slice(0, count);
    rows[count - 1] = rows[count - 1].trimEnd() + '…';
  }
  return rows.map((row, i) => line(x, y + rowHeight * i, row, width, size, { ...options, weight: 500 })).join('');
}

function picture(card, side, p, id, x, y, width, height, photo = card.photos[side]) {
  if (!photo && !card.showArt) return '';

    const scale = Math.max(width / originalW, height / originalH) * photo.zoom;

const $ = selector => document.querySelector(selector);

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('friendship-card-studio', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('projects');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('Storage blocked'));
  });
}
function storedDeck() {
  return new Promise((resolve, reject) => {
    const request = database.transaction('projects').objectStore('projects').get(storageKey);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
function storageLabel(state) {
  storageState = state;
  $('#save-status').textContent = t(state);
  $('#save-status').toggleAttribute('data-error', state === 'storageError');
}
function saveNow() {
  clearTimeout(saveTimer);
  saveTimer = undefined;
  if (!database) return storageLabel('storageError');
  const stamp = ++saveVersion;
  try {
    const transaction = database.transaction('projects', 'readwrite');
    transaction.objectStore('projects').put(currentDeck(), storageKey);
    transaction.oncomplete = () => { if (stamp === saveVersion && !saveTimer) storageLabel('saved'); };
    transaction.onabort = () => storageLabel('storageError');
  } catch { storageLabel('storageError'); }
}
function scheduleSave(immediate = false) {
  if (immediate) return saveNow();
  storageLabel(database ? 'saving' : 'storageError');

  saveTimer = setTimeout(saveNow, 180);
}

function hydrate(deck) {

    if (deck !== embedded && !embedded) cards = refreshUntouchedSamples(cards);
    const seen = new Set();
    for (const card of cards) {
      if (seen.has(card.id)) card.id = id();
      seen.add(card.id);
    }
    activeId = cards.some(card => card.id === deck.activeId) ? deck.activeId : cards[0]?.id || '';

      header.setUint16(12 + shift, 33, true);

function readImport(text) {
  const studio = text.match(/<script\b[^>]*\bid=["']studio-data["'][^>]*>([\s\S]*?)<\/script>/i);
  const legacy = text.match(/<script\b[^>]*\bid=["']card-state["'][^>]*>([\s\S]*?)<\/script>/i);
  if (legacy) return { cards:legacyCards(JSON.parse(legacy[1])), personalTemplates:[], savedVersions:[] };
  const payload = JSON.parse(studio ? studio[1] : text.replace(/^\uFEFF/, ''));
  if (payload?.format !== PORTABLE_FORMAT || payload.version !== 2 || !Array.isArray(payload.cards)) throw new Error('Invalid backup');
  if (payload.cards.length > LIMIT) throw new Error('Too many cards');
  return { cards:payload.cards.map(cleanCard), personalTemplates:readShelf(payload.personalTemplates,20), savedVersions:readShelf(payload.savedVersions,30) };
}
async function setImportedDimensions(card) {
  for (const photo of [...Object.values(card.photos), ...Object.values(card.stripPhotos).flat(), ...Object.values(card.pro.inside).map(panel => panel.photo), ...Object.values(card.pro.stickers).flat().map(sticker=>sticker.photo)]) {
    if (!photo) continue;
    try {
      const image = new Image(); image.src = photo.data;
      await image.decode(); photo.width = image.naturalWidth; photo.height = image.naturalHeight;
    } catch { throw new Error('Invalid embedded photo'); }
  }
}
async function importFile(file) {
  if (file.size > 75_000_000) { toast('uploadError'); return; }
  try {
    const project = readImport(await file.text()), incoming=project.cards;
    if (!incoming.length && !project.personalTemplates.length && !project.savedVersions.length) throw new Error('Empty backup');
    for (const card of [...incoming, ...project.personalTemplates.map(entry=>entry.card), ...project.savedVersions.map(entry=>entry.card)]) { await setImportedDimensions(card); card.id = id(); }
    modalOpen('importTitle', `<p class="modal-description">${incoming.length} ${escapeHTML(t('total'))}. ${escapeHTML(t('importConfirm'))}</p><div class="modal-buttons">${modalButton('cancel', 'cancel')}${modalButton('replace', 'replace')}${modalButton('append', 'append', true)}</div>`);
    $('#modal-body').onclick = event => {
      const action = event.target.closest('[data-action]')?.dataset.action;
      if (action === 'cancel') modal.close();
      if (action !== 'append' && action !== 'replace') return;
      if (action === 'append' && cards.length + incoming.length > LIMIT) { maxCards(); return; }
      cards = action === 'append' ? cards.concat(incoming) : incoming;
      personalTemplates = (action==='append' ? personalTemplates.concat(project.personalTemplates) : project.personalTemplates).slice(0,20);
      savedVersions = (action==='append' ? savedVersions.concat(project.savedVersions) : project.savedVersions).slice(0,30);
      modal.close();
      if (incoming[0]) chooseCard(incoming[0]);
      else { if(!cardNow()) activeId=cards[0]?.id||''; scheduleSave(true); redraw(); }
    };
  } catch { toast('importError'); }
}

function packPrintPages(collection) {
  const left = 10, right = 200, top = 12, bottom = 265, gap = 8;
  const pages = [];
  let slots = [], x = left, y = top, rowHeight = 0;
  for (const card of collection) {
    const [width, height] = productionSize(card);
    if (x + width > right + .001) { x = left; y += rowHeight + gap; rowHeight = 0; }
    if (y + height > bottom + .001) { pages.push(slots); slots = []; x = left; y = top; rowHeight = 0; }
    slots.push({ card, x, y, width, height });
    x += width + gap;
    rowHeight = Math.max(rowHeight, height);
  }
  if (slots.length) pages.push(slots);
  return pages;
}

function printMarks(slots) {
  const marks = slots.flatMap(({ x, y, width, height }) => {
    const right = x + width, bottom = y + height, inner = 1, outer = 3;
    return [y, bottom].flatMap(cy => [[x - outer, cy, x - inner, cy], [right + inner, cy, right + outer, cy]])
      .concat([x, right].flatMap(cx => [[cx, y - outer, cx, y - inner], [cx, bottom + inner, cx, bottom + outer]]));
  });
  return `<svg class="print-marks" viewBox="0 0 210 297" aria-hidden="true" stroke="#596966" stroke-width=".22" fill="none">${marks.map(([x1, y1, x2, y2]) => `<path d="M${x1} ${y1}L${x2} ${y2}"/>`).join('')}</svg>`;
}

function printSheets(selection = printSelection) {
  const collection = selection?.scope === 'allCards' ? cards : cardNow() ? [cardNow()] : [];
  const sides = selection?.sides || 'both';
  const pages = [];
  for (const group of packPrintPages(collection)) {
    for (const side of (sides === 'both' ? ['front', 'back'] : [sides])) {
      const mirror = side === 'back' && sides === 'both';
      const slotInfo = mirror ? group.map(slot => ({ ...slot, x: 210 - slot.x - slot.width })) : group;
      const slots = slotInfo.map(({ card, x, y, width, height }) => `<div class="print-card" style="top:${y}mm;left:${x}mm;width:${width}mm;height:${height}mm">${productionArt(card, side)}</div>`).join('');
      pages.push(`<section class="print-sheet">${slots}${selection?.marks ? printMarks(slotInfo) : ''}<p class="print-note" dir="auto">${escapeHTML(t(side))} · A4 · 100% / Actual size${sides === 'both' ? ' · ' + escapeHTML(lang === 'ur' ? 'لمبے کنارے سے پلٹیں' : 'Flip on the long edge') : ''}</p></section>`);
    }
  }
  $('#print-output').innerHTML = pages.join('');
}

let past = [], future = [], snapshot = null, lastChange = {key:'',time:0}, restoring = false;

  if ($('#pro-undo')) { $('#pro-undo').disabled = !past.length; $('#pro-redo').disabled = !future.length; }
}
function historyPoint(group = '') {
  const fingerprint = JSON.stringify(cards);
  if (snapshot?.fingerprint === fingerprint) { snapshot.activeId = activeId; return; }
  const now=Date.now();
  if (snapshot && !(group && group === lastChange.key && now-lastChange.time < 850)) {
    past.push(snapshot);
    if (past.length > 20) past.shift();
  }
  snapshot={fingerprint,activeId}; future=[]; lastChange={key:group,time:now}; historyButtons();
}

  if (!restoring) {
    const target = document.activeElement;
    const key = !immediate && target?.matches('textarea,input') && target.id ? `${activeId}/${editSide}/${target.id}` : '';
    historyPoint(key);
  }

};

  const from=redo?future:past,to=redo?past:future;
  if (!from.length) return;
  restoring=true;

    to.push(snapshot); snapshot=from.pop();
    cards=JSON.parse(snapshot.fingerprint); activeId=snapshot.activeId;
    if (!cardNow()) activeId=cards[0]?.id||'';

let drag=null;
function wireDirectEditing() {
  const board=$('#artboard');
  board.addEventListener('pointerdown',event=>{
    if (!directMode || event.button!==0) return;
    const layer=event.target.closest('[data-layer]'), card=cardNow();
    if (!layer || !card) return;
    const side=layerSide(layer), key=layer.dataset.layer;
    if (!proSides.includes(side) || (card.pro.locked && (key.startsWith('sticker-') || key.startsWith('photo-')))) return;
    const parent=layer.parentElement.getScreenCTM();
    if (!parent) return;
    const inverse=parent.inverse(), start=new DOMPoint(event.clientX,event.clientY).matrixTransform(inverse);
    drag={layer,key,side,card,inverse,start,initial:card.pro.offsets[side][key]||[0,0],pointer:event.pointerId,moved:false,client:[event.clientX,event.clientY]};
    board.setPointerCapture(event.pointerId); event.preventDefault();

    if (!drag.moved && Math.hypot(event.clientX-drag.client[0],event.clientY-drag.client[1])<4) return;
    drag.moved=true;
    const point=new DOMPoint(event.clientX,event.clientY).matrixTransform(drag.inverse);
    const snap=value=>event.altKey?Math.round(value):Math.round(value/12)*12;
    drag.next=[snap(drag.initial[0]+point.x-drag.start.x),snap(drag.initial[1]+point.y-drag.start.y)];
    drag.layer.setAttribute('transform',`translate(${drag.next.join(' ')})`);

  });

    if (!drag || drag.pointer!==event.pointerId) return;
    const item=drag; drag=null;
    item.layer.closest('figure')?.classList.remove('drag-guides');
    if (event.type==='pointercancel') { redrawPreview(); return; }
    if (!item.moved) { editLayer(item.layer); return; }
    item.card.pro.offsets[item.side][item.key]=item.next.map(v=>bounded(v,-5500,5500,0));
    savePro();
  };
  board.addEventListener('pointerup',finish); board.addEventListener('pointercancel',finish);

    const layer=event.target.closest('[data-layer]'), card=cardNow();
    if (!directMode || !layer || !card) return;
    if (event.key==='Enter' || event.key===' ') { event.preventDefault(); editLayer(layer); return; }

    savePro();
    board.querySelector(`figure[data-pro-side="${side}"] [data-layer="${key}"]`)?.focus();
  });

function proofIssues(card) {
  const [w,h]=dimensions(card), [aw,ah]=artSize(card);
  const surface=document.createElement('div');surface.className='proof-surface';
  const artwork=proSides.map(side=>[side,art(card,side)]);
  if(formatsForProduction(card)) artwork.push(...insideSides.map(side=>[side,insideArt(card,side)]));
  surface.innerHTML=artwork.map(([,svg])=>svg).join('');document.body.append(surface);
  const issues=[];
  const ur=lang==='ur';
  try {
    [...surface.children].forEach((svg,i)=>{
      const side=t(artwork[i][0]);
      const inverse=svg.getScreenCTM().inverse();
      let low=Infinity, unsafe=false, small=false;
      const textBoxes=[];
      let qrBox;
      svg.querySelectorAll('[data-pixels-per-unit]').forEach(node=>{
        low=Math.min(low,Number(node.dataset.pixelsPerUnit)*Math.min(aw/w,ah/h)*25.4);
      });
      svg.querySelectorAll('text, [data-layer="qr"]').forEach(node=>{
        const bounding=node.getBBox(), scale=node.getScreenCTM();
        const points=[[bounding.x,bounding.y],[bounding.x+bounding.width,bounding.y],[bounding.x,bounding.y+bounding.height],[bounding.x+bounding.width,bounding.y+bounding.height]].map(([x,y])=>new DOMPoint(x,y).matrixTransform(scale).matrixTransform(inverse));
        if(points.some(point=>point.x/aw*w < 3 || point.y/ah*h < 3 || (1-point.x/aw)*w < 3 || (1-point.y/ah)*h < 3)) unsafe=true;
        const bounds=[Math.min(...points.map(p=>p.x)),Math.min(...points.map(p=>p.y)),Math.max(...points.map(p=>p.x)),Math.max(...points.map(p=>p.y))];
        if(node.tagName.toLowerCase()==='text') {
          textBoxes.push(bounds);
          if(Number(node.getAttribute('font-size'))/ah*h/25.4*72<6)small=true;
        } else {
          qrBox=bounds;
          if(Number(node.dataset.qrUnit)*w/aw<.27)issues.push(`${side} · ${ur?'QR باریک ہے۔ مختصر لنک استعمال کریں یا بڑا سائز چنیں۔':'QR modules are small. Try a shorter link or a larger card format.'}`);
        }
      });
      if(low<240)issues.push(`${side} · ${ur?'تصویر کی مؤثر ریزولوشن کم ہے':'Low effective photo resolution'} (${Math.round(low)} DPI)`);
      if(unsafe)issues.push(`${side} · ${ur?'متن یا QR کٹائی کے کنارے سے 3 mm سے کم فاصلے پر ہے':'Text or QR is within 3 mm of the trim edge'}`);
      if(small)issues.push(`${side} · ${ur?'کچھ متن 6 پوائنٹ سے چھوٹا ہے':'Some text is under 6 pt'}`);
      if(qrBox && textBoxes.some(box=>box[0]<qrBox[2]&&box[2]>qrBox[0]&&box[1]<qrBox[3]&&box[3]>qrBox[1]))issues.push(`${side} · ${ur?'QR کے نیچے متن ہے۔ QR کو دوسری جگہ رکھیں۔':'The QR code covers text. Move it to a clear spot.'}`);
    });
  } finally {surface.remove();}
  return issues;
}

  const ready=ur?'تصویر کی ریزولوشن اور متن کی جگہ میں کوئی مسئلہ نہیں ملا۔':'No photo-resolution or text-position issues found.';

}

function envelopeSVG(card) {
  const [w,h]=dimensions(card), paneW=w+6,paneH=h+5;
  const side=Math.min(23,Math.max(13,paneW*.21)), cap=Math.min(45,paneH*.54), lower=paneH*.68;
  const left=side+3, top=cap+3, right=left+paneW, bottom=top+paneH, totalW=paneW+2*side+6,totalH=paneH+cap+lower+6;
  const outline=`M${left} ${top}L${left+paneW*.23} 3H${right-paneW*.23}L${right} ${top}l${side} 8v${paneH-16}l-${side} 8L${right-7} ${bottom+lower}H${left+7}L${left} ${bottom}l-${side}-8v-${paneH-16}z`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}mm" height="${totalH}mm" viewBox="0 0 ${totalW} ${totalH}"><title>Envelope cut and fold template</title>
  <path d="${outline}" fill="#fff" stroke="#26352e" stroke-width=".35"/>
  <rect x="${left}" y="${top}" width="${paneW}" height="${paneH}" fill="none" stroke="#557568" stroke-width=".3" stroke-dasharray="2 1.4"/>
  <text x="${left+paneW/2}" y="${top+paneH/2}" font-family="Arial" font-size="3" fill="#475952" text-anchor="middle">${w} × ${h} mm card</text></svg>`;
  return {svg,totalW,totalH};
}
function printEnvelope(card) {
  const {svg,totalW,totalH}=envelopeSVG(card);
  if(totalW>194 || totalH>280){toast(lang==='ur'?'یہ لفافہ A4 سے بڑا ہے۔ SVG کو بڑے کاغذ پر پرنٹ کریں۔':'This envelope exceeds A4. Print the SVG on larger paper.');return;}
  const popup=window.open('','_blank');
  if(!popup){toast(lang==='ur'?'براؤزر میں نئی ونڈو کی اجازت دیں۔':'Allow the browser to open the print window.');return;}
  popup.opener=null;
  popup.document.write(`<!doctype html><meta charset="utf-8"><title>Envelope print</title><style>@page{size:A4;margin:8mm}body{margin:0;font:12px sans-serif}svg{display:block;margin:auto}@media print{p{display:none}}</style>${svg}<p>Solid outline: cut. Dashed lines: fold. Print at 100% / actual size.</p>`);
  popup.document.close();popup.focus();setTimeout(()=>popup.print(),220);
}
function foldMenu() {
  const card=cardNow();if(!card)return;
  const folded=formatsForProduction(card), ur=lang==='ur';
  const hint=ur?'اگلا اور پچھلا رخ باہر کے پینل ہیں۔ اندر کے دونوں پینل الگ ایڈٹ کریں۔ پرنٹ پر مختصر نشان فولڈ کی جگہ بتاتے ہیں۔':'The front and back are the outside panels. Edit the two inside panels separately. Short marks indicate the fold.';
  const fits=dimensions(card)[0]<=95;
  const flip=folded?(ur?'فولڈ بند کریں':'Turn off fold'):(fits?(ur?'فولڈ شامل کریں':'Add fold'):(ur?'A7 سائز اور فولڈ منتخب کریں':'Use A7 and add fold'));
  proModal('fold',`<p class="modal-description">${escapeHTML(hint)}</p><div class="modal-options">
    ${folded?`<button class="option" data-action="insideLeft">${escapeHTML(t('insideLeft'))}</button><button class="option" data-action="insideRight">${escapeHTML(t('insideRight'))}</button>`:''}
    ${!card.pro.locked?`<button class="option" data-action="toggle">${escapeHTML(flip)}</button>`:''}</div>
    <p class="edit-note">${ur?'لفافے کی ٹھوس لکیر کاٹیں، ٹوٹی ہوئی لکیر پر فولڈ کریں۔':'Cut the envelope on the solid line and fold on the dashed lines.'}</p>
    <div class="modal-buttons"><button class="button secondary" data-action="envelope">${ur?'لفافہ SVG':'Envelope SVG'}</button><button class="button primary" data-action="printEnvelope">${ur?'لفافہ پرنٹ کریں':'Print envelope'}</button></div>`,{
      toggle:()=>{if(!folded&&!fits){card.format='formatCustom';card.customWidth=74;card.customHeight=105;}card.pro.folded=!folded;modal.close();view='both';savePro();},
      insideLeft:()=>panelMenu('insideLeft'),insideRight:()=>panelMenu('insideRight'),envelope:()=>download(envelopeSVG(card).svg,`${basename(card)}-envelope.svg`,'image/svg+xml'),printEnvelope:()=>printEnvelope(card)
    });
}

function libraryMenu(versions=false) {
  const card=cardNow(), shelf=versions?savedVersions:personalTemplates;
  const heading=versions?'versions':'myTemplates';
  const entries=shelf.length?shelf.map((item,i)=>`<div class="pro-shelf-row"><span><strong dir="auto">${escapeHTML(item.name)}</strong><small>${escapeHTML(item.date.slice(0,10))}</small></span>
    ${versions&&card?proButton('restore-'+i,'restore'):''}${proButton('copy-'+i,'copyVersion')}${proButton('remove-'+i,'delete')}</div>`).join(''):`<p class="edit-note">${escapeHTML(t('noItems'))}</p>`;
  const lockLabel=lang==='ur'?'آرائش اور سائز لاک کریں':'Lock artwork and size';
  const save=card?`${proInput('shelf-name','labelName','','maxlength="80"')}${versions?'':`<div class="field"><label><input id="shelf-lock" type="checkbox"> ${escapeHTML(lockLabel)}</label></div>`}
    <div class="modal-buttons">${!versions && card.pro.locked?`<button class="button secondary" data-action="unlock">${lang==='ur'?'اس کاپی کا لاک ہٹائیں':'Unlock this copy'}</button>`:''}${proButton('save','saveCurrent',true)}</div>`:'';
  const handlers={unlock:()=>{card.pro.locked=false;modal.close();savePro();},save:()=>{
    const name=$('#shelf-name').value.trim();if(!name)return;
    const design=structuredClone(card);if(!versions)design.pro.locked=$('#shelf-lock').checked;
    shelf.unshift({name,card:design,date:new Date().toISOString()});shelf.splice(versions?30:20);baseScheduleSave(true);libraryMenu(versions);
  }};
  shelf.forEach((entry,i)=>{
    handlers['copy-'+i]=()=>{if(cards.length>=LIMIT){maxCards();return;}const copy={...structuredClone(entry.card),id:id()};cards.push(copy);modal.close();chooseCard(copy);};
    handlers['remove-'+i]=()=>{shelf.splice(i,1);baseScheduleSave(true);libraryMenu(versions);};
    handlers['restore-'+i]=()=>{const index=cards.indexOf(card);if(index<0)return;cards[index]={...structuredClone(entry.card),id:card.id};modal.close();savePro();};
  });
  proModal(heading,`<div class="pro-shelf">${entries}</div>${save}`,handlers);
}

function shareHTML(card) {
  const panels=[...proSides.map(side=>[side,art(card,side)]),...(formatsForProduction(card)?insideSides.map(side=>[side,insideArt(card,side)]):[])];
  const title=escapeHTML(card.title||card.backTitle||t('share'));
  const script=`const cover=document.querySelector('#cover'),gift=document.querySelector('#gift'),open=document.querySelector('#open');open.onclick=()=>{cover.hidden=true;gift.hidden=false;document.querySelector('#gift-title').focus();};const secret=document.querySelector('#secret');if(secret)secret.onclick=()=>{secret.hidden=true;document.querySelector('#message').hidden=false;document.querySelector('#message').focus()};`;
  return `<!doctype html><html lang="${lang}" dir="${lang==='ur'?'rtl':'ltr'}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f2ef;color:#362633;font:1rem system-ui;padding:20px;box-sizing:border-box}button{font:inherit;cursor:pointer;padding:12px 18px;color:white;background:#54374f;border:0;border-radius:8px}h1{font:2rem Georgia,serif}main{max-width:900px;width:100%;text-align:center}.envelope{width:min(340px,85vw);height:180px;margin:0 auto 25px;border-radius:13px;background:#edc9d0;position:relative}.envelope:before{content:'';position:absolute;inset:0;background:#c9869a;clip-path:polygon(0 0,100% 0,50% 72%);border-radius:13px}.envelope b{position:absolute;top:50%;left:46%;color:#57364e;font-size:2.1rem}svg{display:block;width:100%;max-height:560px;height:auto;margin:auto}figure{margin:12px 0 24px}figcaption{padding:7px}[hidden]{display:none!important}#message{background:#fff;margin:15px auto;padding:20px;white-space:pre-wrap;border-radius:12px}#gift:not([hidden]){animation:arrive .32s ease-out}@keyframes arrive{from{opacity:0;transform:translateY(12px)}}@media(prefers-reduced-motion:reduce){#gift:not([hidden]){animation:none}}</style>
  <main><section id="cover"><div class="envelope" aria-hidden="true"><b>♥</b></div><h1>${title}</h1><button id="open">${escapeHTML(t('openEnvelope'))}</button></section>
  <section id="gift" hidden><h1 id="gift-title" tabindex="-1">${title}</h1>${panels.map(([side,svg])=>`<figure>${svg.replace(/\sdata-layer="[^"]*"/g,'')}<figcaption>${escapeHTML(t(side))}</figcaption></figure>`).join('')}
  ${card.pro.surprise?`<button id="secret">${escapeHTML(t('reveal'))}</button><p id="message" tabindex="-1" hidden>${escapeHTML(card.pro.surprise)}</p>`:''}</section></main>${'<scr'+'ipt>'}${script}${'</scr'+'ipt>'}</html>`;
}

};
wireControls = function() {
  baseWireControls();

  $('#pro-direct').onclick=()=>{directMode=!directMode;redrawPreview();};

};
start=async function(){await baseStart();historyPoint();historyButtons();};
