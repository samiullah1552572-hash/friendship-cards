<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Design, save and print personalised friendship cards.">
<title>Friendship Card Studio</title>
<style>
:root {
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  color: #20322f;
  background: #f5f6f0;
  --green: #235749;
  --dark: #194335;
  --muted: #566961;
  --border: #dbe4db;
  --panel: #fff;
  --pale: #edf4ee;
  --shadow: 0 5px 24px #243b2710;
  line-height: 1.5;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 300px; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: wait; opacity: .55; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #519783; outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
.topbar { background: #fcfdf8; border-bottom: 1px solid var(--border); }
.top-inner, .shell { max-width: 1540px; padding-inline: clamp(16px, 3.45vw, 52px); margin-inline: auto; }
.top-inner { display: flex; justify-content: space-between; align-items: center; gap: 14px; min-height: 72px; }
.brand { color: var(--dark); display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-size: 17px; font-weight: 800; white-space: nowrap; }
.brand-mark { inline-size: 35px; block-size: 35px; display: grid; place-items: center; background: #e3efe4; border-radius: 10px; }
.brand-muted { font-weight: 500; }
.top-actions, .export-actions, .library-actions { display: flex; align-items: center; gap: 8px; }
.save-status { color: var(--muted); font-size: 12px; padding-inline: 7px; }
.save-status::before { content: '●'; color: #589679; margin-inline-end: 6px; font-size: 8px; vertical-align: 2px; }
.save-status[data-error]::before { color: #a33947; }
.button, .icon-button { border: 1px solid transparent; background: transparent; color: var(--green); display: inline-flex; justify-content: center; align-items: center; gap: 8px; border-radius: 9px; font-size: 13px; font-weight: 700; min-height: 38px; padding: 8px 12px; line-height: 1.3; }
.button svg, .icon-button svg, .brand-mark svg, .size-label svg { width: 17px; height: 17px; flex: none; }
.icon-button { min-width: 36px; padding: 7px; border-color: var(--border); }
.primary { background: var(--green); color: #fff; border-color: var(--green); }
.primary:hover { background: var(--dark); }
.quiet:hover, .icon-button:hover { background: var(--pale); }
.secondary { background: #fff; border-color: var(--border); }
.secondary:hover { background: #f3f7f2; }
.danger { color: #9a394c; }
.shell { padding-block: 36px 22px; }
.intro { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 29px; }
.eyebrow { color: #477261; font-size: 10px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
.intro h1 { color: #1b382f; font-family: Georgia, 'Segoe UI', serif; font-weight: 500; font-size: clamp(29px, 4.1vw, 57px); line-height: 1.13; letter-spacing: -.038em; margin: 6px 0 8px; }
.intro p, .panel-head p { color: var(--muted); font-size: 13px; }
.intro .primary { padding: 11px 16px; white-space: nowrap; }
.workspace { display: grid; grid-template-columns: minmax(175px, .83fr) minmax(360px, 2.6fr) minmax(235px, 1.1fr); align-items: start; gap: 16px; }
.panel { min-width: 0; background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 16px; }
.panel-head { padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.panel-head h2 { font-size: 16px; font-weight: 750; overflow-wrap: anywhere; }
.panel-head p { margin-top: 3px; font-size: 12px; }
.library-list { padding: 0 10px 10px; display: grid; gap: 5px; max-height: 500px; overflow: auto; }
.library-item { width: 100%; text-align: start; display: flex; gap: 10px; align-items: center; border: 1px solid transparent; background: transparent; border-radius: 9px; padding: 9px 7px; color: inherit; }
.library-item:hover { background: #f5f8f4; }
.library-item[aria-current="true"] { background: var(--pale); border-color: #d4e5d7; }
.thumb { flex: 0 0 49px; height: 33px; border: 1px solid #bfcdc2; border-radius: 6px; display: grid; place-items: center; }
.thumb svg { width: 19px; height: 19px; }
.item-copy { min-width: 0; }
.item-copy strong, .item-copy small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.item-copy strong { color: #243a30; font-size: 12px; }
.item-copy small { color: var(--muted); font-size: 11px; margin-top: 3px; }
.library-actions { border-top: 1px solid var(--border); padding: 9px 7px; flex-wrap: wrap; }
.library-actions .button { padding-inline: 7px; font-size: 11px; }
.library-actions .button svg { width: 14px; height: 14px; }
.canvas-title { min-width: 0; }
.canvas-title .eyebrow { margin-bottom: 3px; }
.canvas-title h2 { font-size: 18px; }
.segmented { display: flex; padding: 3px; background: #f1f5ef; border-radius: 9px; gap: 1px; flex: none; }
.segmented button { min-width: 42px; white-space: nowrap; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--muted); padding: 5px 8px; min-height: 29px; font-size: 11px; font-weight: 700; }
.segmented button[aria-pressed="true"] { background: #fff; color: var(--green); border-color: #dae5da; box-shadow: 0 1px 3px #21462b12; }
.artboard { padding: clamp(14px, 2.35vw, 36px); min-height: 325px; display: grid; align-content: center; justify-items: center; gap: 25px; background-color: #edf2ea; background-image: radial-gradient(#a4b6a787 1px, transparent 1px); background-size: 17px 17px; border-block: 1px solid #e1e8df; }
.preview-side { margin: 0; width: 100%; max-width: 780px; min-width: 0; }
.preview-side svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 9px 13px #182b2442); }
.preview-side figcaption { margin-top: 9px; text-align: center; color: #405c50; font-size: 11px; font-weight: 700; }
.canvas-footer { padding: 11px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.size-label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; white-space: nowrap; direction: ltr; }
.editor-tabs { display: flex; border-block: 1px solid var(--border); padding: 0 11px; }
.editor-tabs button { flex: 1; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; padding: 10px 4px; }
.editor-tabs button[aria-pressed="true"] { border-bottom-color: var(--green); color: var(--green); }
.editor { padding: 15px; }
.editor label, .field-label { display: block; margin-bottom: 5px; color: #3e534a; font-size: 12px; font-weight: 700; }
.field { margin-bottom: 12px; min-width: 0; }
.field:last-child { margin-bottom: 0; }
.field input:not([type="checkbox"]), .field select, .field textarea { width: 100%; min-width: 0; border: 1px solid #cfdcd2; border-radius: 7px; color: #253b31; background: #fcfdfb; font-size: 13px; padding: 7px 8px; }
.field textarea { resize: vertical; min-height: 66px; }
.field input[type="color"] { height: 39px; padding: 3px; }
.field input[type="range"] { padding: 0; accent-color: var(--green); }
.field input[type="checkbox"] { accent-color: var(--green); }
.field .check-label { display: flex; align-items: center; gap: 8px; }
.field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.edit-note, .modal-description { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.field-detail { margin-top: 13px; border-top: 1px solid var(--border); padding-top: 12px; }
.field-detail summary { cursor: pointer; margin-bottom: 12px; font-size: 12px; font-weight: 700; }
.swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 13px; }
.swatch { border: 1px solid var(--border); border-radius: 8px; background: #fff; padding: 6px 2px; font-size: 10px; font-weight: 650; color: #2b4439; }
.swatch i { display: block; width: 21px; height: 21px; border-radius: 50%; border: 1px solid #788c7b80; margin: 0 auto 4px; }
.swatch[aria-pressed="true"] { background: var(--pale); outline: 1px solid var(--green); }
.photo-file { width: 100%; margin-bottom: 9px; color: var(--muted); font-size: 12px; }
.photo-file::file-selector-button { padding: 6px 8px; border: 1px solid var(--border); color: var(--green); font: inherit; background: #fff; border-radius: 6px; margin-inline-end: 8px; }
.footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 12px; color: var(--muted); font-size: 12px; }
dialog { width: min(540px, calc(100% - 28px)); max-height: calc(100dvh - 30px); overflow: auto; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 24px 75px #152a274d; color: inherit; padding: 0; }
dialog::backdrop { background: #142c266b; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 17px 19px; border-bottom: 1px solid var(--border); gap: 16px; }
.modal-head h2 { font-size: 19px; }
.modal-body { padding: 18px 19px; }
.modal-options { display: grid; gap: 8px; margin-bottom: 12px; }
.option { padding: 10px 12px; text-align: start; border: 1px solid var(--border); background: #fff; color: var(--green); border-radius: 8px; display: flex; align-items: center; gap: 12px; }
.option:hover { background: var(--pale); }
.option strong, .option small { display: block; }
.option strong { font-size: 13px; }
.option small { color: var(--muted); font-size: 12px; margin-top: 2px; }
.option svg { width: 22px; height: 22px; flex: none; }
.modal-buttons { display: flex; gap: 8px; justify-content: end; flex-wrap: wrap; }
.gallery-modal { width: min(860px, calc(100% - 28px)); }
.gallery-modal .modal-head { position: sticky; top: 0; background: white; z-index: 1; }
.template-gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.template-option { display: flex; flex-direction: column; width: 100%; min-width: 0; background: #fff; color: inherit; border: 1px solid var(--border); border-radius: 11px; padding: 7px; text-align: start; }
.template-option:hover { background: #f4f8f3; border-color: #8daf9c; }
.template-thumb { display: block; aspect-ratio: 1200 / 757; overflow: hidden; width: 100%; border-radius: 7px; background: #f3f5f1; }
.template-thumb > svg { display: block; width: 100%; height: 100%; }
.template-blank { height: 100%; display: grid; place-items: center; color: #507666; }
.template-blank svg { width: 28px; height: 28px; }
.template-copy { display: block; padding: 7px 4px 3px; }
.template-copy strong, .template-copy small { display: block; }
.template-copy strong { color: var(--dark); font-size: 13px; }
.template-copy small { margin-block-start: 2px; color: var(--muted); font-size: 11px; }
.pair-option { margin-block-start: 13px; }
.pair-option .option { width: 100%; }
@media (max-width: 610px) { .template-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } }
.help-list { padding-inline-start: 22px; font-size: 13px; }
.help-list li { margin-bottom: 9px; }
#toast { position: fixed; z-index: 10; inset-block-end: 18px; inset-inline-start: 50%; translate: -50% 0; background: #234e41; color: #fff; padding: 11px 16px; border-radius: 9px; width: max-content; max-width: calc(100vw - 24px); box-shadow: 0 4px 19px #213c3080; font-size: 13px; }
[dir="rtl"] #toast { translate: 50% 0; }
[dir="rtl"] .intro h1 { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; letter-spacing: 0; line-height: 1.5; }
[dir="rtl"] .eyebrow { letter-spacing: 0; }
.brand { direction: ltr; }
#print-output { display: none; }
@media (max-width: 1010px) {
  .workspace { grid-template-columns: minmax(0, 1.8fr) minmax(222px, 1fr); }
  .library { grid-column: 1 / -1; display: flex; align-items: center; }
  .library .panel-head { padding: 10px; }
  .library-list { display: flex; flex: 1; overflow-x: auto; padding-block: 7px; }
  .library-item { min-width: 145px; }
  .library-actions { border-top: 0; }
}
@media (max-width: 650px) {
  .top-inner { min-height: 59px; gap: 8px; }
  .top-actions { gap: 1px; }
  .top-actions .button { padding-inline: 6px; font-size: 11px; }
  .top-actions .button svg, .save-status { display: none; }
  .brand { font-size: 13px; gap: 6px; }
  .brand-mark { inline-size: 28px; block-size: 28px; }
  .shell { padding-block-start: 23px; }
  .intro { align-items: flex-start; flex-direction: column; margin-bottom: 16px; }
  .workspace { display: flex; flex-direction: column; gap: 12px; }
  .panel { width: 100%; }
  .library { flex-wrap: wrap; }
  .library .panel-head { width: 100%; }
  .library-list { flex-basis: 100%; padding-top: 0; }
  .library-actions { padding: 2px 8px 6px; }
  .canvas-head { padding: 11px; }
  .artboard { min-height: 0; }
  .footer { align-items: start; }
}
@page { size: A4 portrait; margin: 0; }
@media print {
  :root, body { background: #fff; }
  body > :not(#print-output) { display: none !important; }
  #print-output { display: block; direction: ltr; }
  .print-sheet { width: 210mm; height: 297mm; position: relative; overflow: hidden; break-after: page; }
  .print-sheet:last-child { break-after: auto; }
  .print-card { width: 85.6mm; height: 54mm; position: absolute; }
  .print-card svg { width: 100%; height: 100%; display: block; }
  .print-note { position: absolute; top: 270mm; left: 12mm; right: 12mm; color: #3f594d; font: 9pt Arial, sans-serif; }
  * { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="top-inner">
    <a class="brand" href="#studio" aria-label="Friendship Card Studio"><span class="brand-mark" data-icon="heart"></span><span>Friendship<span class="brand-muted"> Studio</span></span></a>
    <div class="top-actions">
      <span class="save-status" id="save-status" role="status"></span>
      <button type="button" class="button quiet" id="language" aria-label="Switch language">اردو</button>
      <button type="button" class="button quiet" id="import" data-icon="upload" data-i="import"></button>
      <button type="button" class="button secondary" id="project" data-icon="folder" data-i="project"></button>
    </div>
  </div>
</header>
<main id="studio" class="shell">
  <section class="intro" aria-labelledby="page-title">
    <div><div class="eyebrow" data-i="workspace"></div><h1 id="page-title" data-i="headline"></h1><p data-i="intro"></p></div>
    <button type="button" class="button primary" id="new-card" data-icon="plus" data-i="newCard"></button>
  </section>
  <div class="workspace">
    <aside class="panel library" aria-labelledby="library-heading">
      <div class="panel-head"><div><h2 id="library-heading" data-i="myCards"></h2><p id="card-count"></p></div><button type="button" class="icon-button" id="library-add" data-icon="plus" data-label="newCard"></button></div>
      <div id="library-list" class="library-list"></div>
      <div class="library-actions"><button class="button quiet" id="duplicate" data-icon="copy" data-i="duplicate"></button><button class="button quiet danger" id="delete" data-icon="trash" data-i="delete"></button></div>
    </aside>
    <section class="panel canvas" aria-labelledby="preview-heading">
      <div class="panel-head canvas-head"><div class="canvas-title"><div class="eyebrow" data-i="preview"></div><h2 id="preview-heading" dir="auto"></h2></div>
        <div class="segmented sides" aria-label="Card side"><button type="button" data-view="front" data-i="front"></button><button type="button" data-view="back" data-i="back"></button><button type="button" data-view="both" data-i="both"></button></div>
      </div>
      <div id="artboard" class="artboard"></div>
      <div class="canvas-footer">
        <div class="size-label"><span data-icon="ruler"></span><span>85.6 × 54 mm</span></div>
        <div class="export-actions"><button class="button quiet" id="print" data-icon="printer" data-i="print"></button><button class="button primary" id="export" data-icon="download" data-i="export"></button></div>
      </div>
    </section>
    <aside class="panel inspector" aria-labelledby="edit-heading">
      <div class="panel-head"><div><h2 id="edit-heading" data-i="edit"></h2><p id="edit-description"></p></div></div>
      <div class="editor-tabs" aria-label="Editor tools"><button data-tab="text" data-i="text"></button><button data-tab="design" data-i="design"></button><button data-tab="photo" data-i="photo"></button></div>
      <div id="editor" class="editor"></div>
    </aside>
  </div>
  <footer class="footer"><span data-i="localNotice"></span><button class="button quiet" id="help" data-i="help"></button></footer>
</main>
<div id="print-output" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="import-file" accept=".json,.html,.htm,application/json,text/html" hidden>
<dialog id="modal" aria-labelledby="modal-title">
  <div class="modal-head"><h2 id="modal-title"></h2><form method="dialog"><button class="icon-button" data-icon="close" data-label="close"></button></form></div>
  <div id="modal-body" class="modal-body"></div>
</dialog>
<script id="studio-data" type="application/json">null</script>
<script>

  note: ['Message', 'پیغام'], noteTitle: ['Message heading', 'پیغام کا عنوان'], footer: ['Bottom caption', 'نیچے کا جملہ'],

function id() {
  return Array.from(crypto.getRandomValues(new Uint8Array(10)), byte => byte.toString(16).padStart(2, '0')).join('');
}

function fresh(template = 'license') {
  const content = templates[template];
  return {
    ...Object.fromEntries(Object.keys(textFields).map(key => [key, ''])),
    ...(template === 'license' ? labelDefaults : {}), ...content,
    id: id(), template, owner: '', friend: '', customColor: '#397766', font: content.font || 'sans',
    showArt: template !== 'blank', showStamp: template === 'license', showCode: template === 'license',
    photos: { front: null, back: null }
  };
}

const starterLabels = ['Bestie One', 'Bestie Two'];

  ];
}

// Checksums identify the two earlier sample pairs without embedding their names in the published file.
const formerSampleLabels = [
  new Set([0x2044a203, 0x6de55284]),
  new Set([0x57b1dbd8, 0xe4a71af1])
];

function refreshUntouchedSamples(cards) {
  const samples = starterCards();
  const matchingSample = (card, sample) => Object.keys(sample).every(key => {
    if (['id', 'owner', 'friend'].includes(key)) return true;
    if (key === 'photos') return !card.photos.front && !card.photos.back;
    return card[key] === sample[key];
  });
  return cards.map(card => {
    const labelSignature = crc32(encoder.encode(card.owner + '\0' + card.friend));
    const index = samples.findIndex((sample, slot) => formerSampleLabels[slot].has(labelSignature) && matchingSample(card, sample));
    return index < 0 ? card : { ...card, owner: starterLabels[index], friend: starterLabels[1 - index] };
  });
}

const bounded = (value, low, high, fallback) => Number.isFinite(value) ? Math.max(low, Math.min(high, value)) : fallback;

function cleanPhoto(value) {
  const photo = typeof value === 'string' ? { data: value } : value;
  if (!photo || typeof photo.data !== 'string' || !/^data:image\/(?:png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(photo.data)) return null;
  if (photo.data.length > 12_000_000) throw new Error('Photo too large');
  return { data: photo.data, width: bounded(photo.width, 1, 20000, 0), height: bounded(photo.height, 1, 20000, 0),
    zoom: bounded(photo.zoom, 1, 3, 1), x: bounded(photo.x, -100, 100, 0), y: bounded(photo.y, -100, 100, 0) };
}

function cleanCard(value) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('Invalid card');
  const template = Object.hasOwn(templates, value.template) ? value.template : 'license';
  const card = fresh(template);
  if (typeof value.id === 'string' && /^[a-zA-Z0-9-]{1,64}$/.test(value.id)) card.id = value.id;
  for (const [key, max] of Object.entries(textFields)) if (typeof value[key] === 'string') card[key] = value[key].slice(0, max);
  if (Object.hasOwn(palettes, value.theme) || value.theme === 'custom') card.theme = value.theme;
  if (typeof value.customColor === 'string' && /^#[\da-f]{6}$/i.test(value.customColor)) card.customColor = value.customColor;
  if (layouts.includes(value.layout)) card.layout = value.layout;
  if (['sans', 'serif'].includes(value.font)) card.font = value.font;
  for (const key of ['showArt', 'showStamp', 'showCode']) if (typeof value[key] === 'boolean') card[key] = value[key];
  for (const side of ['front', 'back']) card.photos[side] = cleanPhoto(value.photos?.[side]);
  return card;
}

function legacyCards(legacy) {
  if (!legacy || typeof legacy.nameA !== 'string' || typeof legacy.nameB !== 'string') throw new Error('Invalid legacy file');
  const themes = { blue: 'sky', lilac: 'lavender', rose: 'rose', mint: 'mint' };
  const mapping = { heading: 'title', subtitle: 'subtitle', level: 'level', licenseType: 'kind', issued: 'issued', expiry: 'valid', caption: 'caption',
    quote: 'frontFooter', codeTitle: 'frontListTitle', rules: 'frontRules', seal: 'stamp', backHeading: 'backTitle', backSubtitle: 'backSubtitle',
    noteTitle: 'noteTitle', backPromisesTitle: 'backListTitle', backRules: 'backRules', backQuote: 'backFooter' };
  return [0, 1].map(i => {
    const letter = i ? 'B' : 'A', other = i ? 'A' : 'B';
    const card = { ...fresh(), owner: legacy['name' + letter], friend: legacy['name' + other], theme: themes[legacy['theme' + letter]] || (i ? 'lavender' : 'sky') };

const $ = selector => document.querySelector(selector);

function t(key) { return (phrases[key] || labelNames[key] || [key, key])[lang === 'ur' ? 1 : 0]; }

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('friendship-card-studio', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('projects');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('Storage blocked'));
  });
}
function storedDeck() {
  return new Promise((resolve, reject) => {
    const request = database.transaction('projects').objectStore('projects').get(storageKey);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
function storageLabel(state) {
  storageState = state;
  $('#save-status').textContent = t(state);
  $('#save-status').toggleAttribute('data-error', state === 'storageError');
}
function saveNow() {
  clearTimeout(saveTimer);
  saveTimer = undefined;
  if (!database) return storageLabel('storageError');
  const stamp = ++saveVersion;
  try {
    const transaction = database.transaction('projects', 'readwrite');
    transaction.objectStore('projects').put(currentDeck(), storageKey);
    transaction.oncomplete = () => { if (stamp === saveVersion && !saveTimer) storageLabel('saved'); };
    transaction.onabort = () => storageLabel('storageError');
  } catch { storageLabel('storageError'); }
}
function scheduleSave(immediate = false) {
  if (immediate) return saveNow();
  storageLabel(database ? 'saving' : 'storageError');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 180);
}
addEventListener('pagehide', () => { if (saveTimer) saveNow(); });

function hydrate(deck) {
  if (deck && Array.isArray(deck.cards)) {
    cards = deck.cards.slice(0, LIMIT).map(cleanCard);
    if (deck !== embedded && !embedded) cards = refreshUntouchedSamples(cards);
    const seen = new Set();
    for (const card of cards) {
      if (seen.has(card.id)) card.id = id();
      seen.add(card.id);
    }
    activeId = cards.some(card => card.id === deck.activeId) ? deck.activeId : cards[0]?.id || '';
    lang = deck.lang === 'ur' ? 'ur' : 'en';
  } else {
    cards = starterCards();
    activeId = cards[0].id;
  }
}

function translate() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ur' ? 'rtl' : 'ltr';
  $$('[data-i]').forEach(node => {
    node.innerHTML = (node.dataset.icon ? icon(node.dataset.icon) : '') + escapeHTML(t(node.dataset.i));
  });
  $$('[data-icon]:not([data-i])').forEach(node => { node.innerHTML = icon(node.dataset.icon); });
  $$('[data-label]').forEach(node => { node.setAttribute('aria-label', t(node.dataset.label)); node.title = t(node.dataset.label); });
  $('#language').textContent = lang === 'en' ? 'اردو' : 'English';
  $('#language').setAttribute('aria-label', lang === 'en' ? 'اردو میں دکھائیں' : 'Switch to English');
  $('.sides').setAttribute('aria-label', t('editSide'));
  $('.editor-tabs').setAttribute('aria-label', t('edit'));
  storageLabel(storageState);
}

function optionMarkup(values, selected) {
  return values.map(value => `<option value="${value}"${value === selected ? ' selected' : ''}>${escapeHTML(t(value))}</option>`).join('');
}
function field(key, label, value, multiline = false, placeholder = '') {

  const attributes = `id="${id}" data-field="${key}" dir="auto" maxlength="${max}" placeholder="${escapeHTML(placeholder)}"`;
  const control = multiline ? `<textarea ${attributes} rows="${key.endsWith('Rules') ? 5 : 3}">${escapeHTML(value)}</textarea>` : `<input ${attributes} value="${escapeHTML(value)}">`;
  return `<div class="field"><label for="${id}">${escapeHTML(t(label))}</label>${control}</div>`;
}
function selectField(key, label, value, options, attribute = 'data-field') {
  return `<div class="field"><label for="field-${key}">${escapeHTML(t(label))}</label><select id="field-${key}" ${attribute}="${key}">${optionMarkup(options, value)}</select></div>`;
}
function details(fields) {
  return `<details class="field-detail"><summary>${escapeHTML(t('more'))}</summary>${fields}</details>`;
}
function textPanel(card) {

  const names = f('owner', 'holder') + f('friend');
  if (editSide === 'back') {
    return names + f('backTitle', 'mainTitle') + f('backSubtitle', 'subtitle') + f('noteTitle') + f('note', 'note', true) + f('backFooter', 'footer') +

        ['backOwnerLabel', 'backFriendLabel', 'signatureLabelA', 'signatureLabelB', 'backFootnote'].map(key => f(key)).join(''));
  }
  const classic = card.layout === 'classic';
  const added = classic ? f('level') + f('kind') + `<div class="field-pair">${f('issued')}${f('valid')}</div>` : f('frontMessage', 'note', true);
  return names + f('title', 'mainTitle') + f('subtitle') + added + f('frontFooter', 'footer') + details(f('caption', 'photoCaption') + f('stamp') +
    (classic ? f('frontListTitle', 'ruleTitle') + f('frontRules', 'frontRules', true) : '') +
    (classic ? ['holderLabel', 'friendLabel', 'levelLabel', 'typeLabel', 'issuedLabel', 'expiryLabel', 'approved'] : []).concat(['sealTop', 'sealBottom', 'photoLabel', 'footnote']).map(key => f(key)).join(''));
}
function designPanel(card) {

function toast(key, action) {

  if (action) {
    const button = document.createElement('button');
    button.className = 'button secondary';
    button.style.marginInlineStart = '8px';

  toastTimer = setTimeout(() => { notice.hidden = true; }, action ? 8000 : 3500);
}
function modalOpen(title, content) {
  modal.classList.toggle('gallery-modal', title === 'newCard');
  $('#modal-title').textContent = t(title);
  $('#modal-body').innerHTML = content;
  if (!modal.open) modal.showModal();
}
function modalOption(action, title, description, symbol) {
  return `<button type="button" class="option" data-action="${action}">${icon(symbol)}<span><strong>${escapeHTML(t(title))}</strong><small>${escapeHTML(t(description))}</small></span></button>`;
}
function modalButton(action, label, primary = false) {
  return `<button type="button" class="button ${primary ? 'primary' : 'secondary'}" data-action="${action}">${escapeHTML(t(label))}</button>`;
}
const maxCards = () => {
  toast(lang === 'ur' ? `ایک پروجیکٹ میں زیادہ سے زیادہ ${LIMIT} کارڈ رکھ سکتے ہیں۔` : `A project can hold up to ${LIMIT} cards.`);
};
function showTemplates() {
  if (cards.length >= LIMIT) { maxCards(); return; }
  const pairOption = cards.length <= LIMIT - 2 ? modalOption('pair', 'pair', 'pairDesc', 'copy') : '';
  const gallery = Object.keys(templates).map(template => {
    const sample = fresh(template);
    if (template !== 'blank') sample.owner = template === 'license' ? starterLabels[0] : 'For You';
    if (template === 'license') sample.friend = starterLabels[1];
    const thumbnail = template === 'blank' ? `<div class="template-blank">${icon('plus')}</div>` : art(sample, 'front');
    return `<button type="button" class="template-option" data-action="${template}">
      <span class="template-thumb" aria-hidden="true">${thumbnail}</span>
      <span class="template-copy"><strong>${escapeHTML(t(template))}</strong><small>${escapeHTML(t(template + 'Desc'))}</small></span>
    </button>`;
  }).join('');
  modalOpen('newCard', `<p class="modal-description">${escapeHTML(t('chooseTemplate'))}</p><div class="template-gallery">${gallery}</div>${pairOption ? `<div class="pair-option">${pairOption}</div>` : ''}`);
  $('#modal-body').onclick = event => {
    const template = event.target.closest('[data-action]')?.dataset.action;
    if (template === 'pair') { showPair(); return; }
    if (!Object.hasOwn(templates, template)) return;
    const card = fresh(template);
    cards.push(card);
    view = editSide = 'front';
    tab = 'text';
    modal.close();
    chooseCard(card);
    $('#field-owner')?.focus({ preventScroll: true });
  };
}

function showPair() {
  const nameInput = (key, label) => `<div class="field"><label for="${key}">${escapeHTML(t(label))}</label><input id="${key}" dir="auto" required maxlength="56"></div>`;
  modalOpen('pair', `<p class="modal-description">${escapeHTML(t('pairDesc'))}</p><form id="pair-form">${nameInput('first-name', 'firstName')}${nameInput('second-name', 'secondName')}
    <div class="modal-buttons">${modalButton('cancel', 'cancel')}<button type="submit" class="button primary">${escapeHTML(t('createPair'))}</button></div></form>`);
  $('#modal-body').onclick = event => { if (event.target.closest('[data-action]')?.dataset.action === 'cancel') showTemplates(); };
  $('#pair-form').onsubmit = event => {
    event.preventDefault();
    const first = $('#first-name').value.trim(), second = $('#second-name').value.trim();
    if (!first || !second) { toast('twoNames'); return; }
    if (cards.length > LIMIT - 2) { maxCards(); return; }
    const card = { ...fresh(), owner: first, friend: second };
    cards.push(card, { ...fresh(), owner: second, friend: first, theme: 'lavender' });
    view = editSide = 'front'; tab = 'text';
    modal.close(); chooseCard(card);
  };
  $('#first-name').focus();
}

function duplicateCard() {
  const original = cardNow();
  if (!original) return;
  if (cards.length >= LIMIT) { maxCards(); return; }
  const card = structuredClone(original);
  card.id = id();
  cards.splice(cards.indexOf(original) + 1, 0, card);
  chooseCard(card);
}
function removeCard() {
  const card = cardNow();
  if (!card) return;
  modalOpen('delete', `<p class="modal-description">${escapeHTML(t('deleteQuestion'))} <strong dir="auto">${escapeHTML(cardName(card))}</strong></p><div class="modal-buttons">${modalButton('cancel', 'cancel')}${modalButton('delete', 'delete', true)}</div>`);
  $('#modal-body').onclick = event => {
    const action = event.target.closest('[data-action]')?.dataset.action;
    if (action === 'cancel') modal.close();
    if (action !== 'delete') return;
    const index = cards.indexOf(card);
    if (index === -1) return;
    cards.splice(index, 1);
    activeId = cards[Math.min(index, cards.length - 1)]?.id || '';
    modal.close();
    scheduleSave(true);
    redraw();
    toast('deleted', () => {
      if (cards.length >= LIMIT) { maxCards(); return; }
      cards.splice(Math.min(index, cards.length), 0, card);
      chooseCard(card);
    });
  };
}

function changeField(input) {
  const card = cardNow();
  if (!card || !input.dataset.field) return;
  const key = input.dataset.field;
  card[key] = input.type === 'checkbox' ? input.checked : input.value;
  if (key === 'customColor') {
    card.theme = 'custom';
    $$('[data-palette]').forEach(button => button.setAttribute('aria-pressed', 'false'));
  }
  redrawPreview();
  if (key === 'owner' || key === 'title' || key === 'backTitle' || key === 'customColor') redrawLibrary();
  if (key === 'layout') redrawEditor();
  scheduleSave();
}
async function loadImage(file) {
  if (file.size > 32_000_000) throw new Error('Image too large');
  const bitmap = await createImageBitmap(file);
  try {
    const ratio = Math.min(1, 1400 / Math.max(bitmap.width, bitmap.height));
    const width = Math.max(1, Math.round(bitmap.width * ratio)), height = Math.max(1, Math.round(bitmap.height * ratio));
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    const context = canvas.getContext('2d');
    context.fillStyle = '#fff'; context.fillRect(0, 0, width, height);
    context.drawImage(bitmap, 0, 0, width, height);
    return { data: canvas.toDataURL('image/jpeg', .88), width, height, zoom: 1, x: 0, y: 0 };
  } finally { bitmap.close(); }
}
editor.addEventListener('input', event => {
  const input = event.target, card = cardNow();
  if (!card) return;
  if (input.dataset.crop) {
    const photo = card.photos[editSide];
    if (photo) photo[input.dataset.crop] = Number(input.value);
    redrawPreview();
    scheduleSave();
  } else if (input.matches('input:not([type="file"]), textarea, select[data-field]')) {
    changeField(input);
  }
});
editor.addEventListener('change', async event => {
  const input = event.target, card = cardNow(), side = editSide;
  if (input.dataset.sideControl) {
    editSide = input.value;
    redrawPreview(); redrawEditor();
    return;
  }
  if (!card || input.id !== 'photo-file' || !input.files[0]) return;
  const file = input.files[0];
  input.disabled = true;
  try {
    const photo = await loadImage(file);
    if (!cards.includes(card)) return;
    card.photos[side] = photo;
    scheduleSave(true);
    redrawPreview();
    if (cardNow() === card && editSide === side && tab === 'photo') redrawEditor();
  } catch { toast('badPhoto'); }
  finally { input.disabled = false; input.value = ''; }
});
editor.addEventListener('click', event => {
  const button = event.target.closest('button'), card = cardNow();
  if (!button || !card) return;
  if (button.dataset.palette) {
    card.theme = button.dataset.palette;
    $$('[data-palette]').forEach(choice => choice.setAttribute('aria-pressed', String(choice === button)));
  } else if (button.dataset.photoAction === 'remove') {
    card.photos[editSide] = null;
    redrawEditor();
  } else if (button.dataset.photoAction === 'reset' && card.photos[editSide]) {
    Object.assign(card.photos[editSide], { zoom: 1, x: 0, y: 0 });
    redrawEditor();
  } else return;
  redrawLibrary(); redrawPreview(); scheduleSave(true);
});

function download(data, name, mediaType) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mediaType });
  const url = URL.createObjectURL(blob), anchor = document.createElement('a');
  anchor.href = url; anchor.download = name;
  document.body.append(anchor); anchor.click(); anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function basename(card) {
  return (card.owner.trim() || card.title.trim() || 'Friendship-Card').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '') || 'Friendship-Card';
}
async function png(svg) {
  const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  try {
    const image = new Image(); image.src = url;
    await image.decode();
    const canvas = document.createElement('canvas');
    canvas.width = W * 2; canvas.height = H * 2;
    canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
    return await new Promise((resolve, reject) => canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('PNG creation failed')), 'image/png'));
  } finally { URL.revokeObjectURL(url); }
}

const crcTable = Uint32Array.from({ length: 256 }, (_, i) => {
  for (let bit = 0; bit < 8; bit++) i = (i & 1) ? (i >>> 1) ^ 0xedb88320 : i >>> 1;
  return i >>> 0;
});
function crc32(bytes) {
  let value = 0xffffffff;
  for (const b of bytes) value = crcTable[(value ^ b) & 255] ^ (value >>> 8);
  return (value ^ 0xffffffff) >>> 0;
}
const encoder = new TextEncoder();
function zip(entries) {
  const files = [], directory = [];
  let offset = 0, dirSize = 0;
  for (const { filename, bytes } of entries) {
    const name = encoder.encode(filename), crc = crc32(bytes);
    const local = new DataView(new ArrayBuffer(30)), central = new DataView(new ArrayBuffer(46));
    local.setUint32(0, 0x04034b50, true); central.setUint32(0, 0x02014b50, true);
    central.setUint16(4, 20, true);
    for (const [header, shift] of [[local, 0], [central, 2]]) {
      header.setUint16(4 + shift, 20, true); header.setUint16(6 + shift, 0x0800, true);
      header.setUint16(12 + shift, 33, true);
      header.setUint32(14 + shift, crc, true); header.setUint32(18 + shift, bytes.length, true);
      header.setUint32(22 + shift, bytes.length, true); header.setUint16(26 + shift, name.length, true);
    }
    central.setUint32(42, offset, true);
    files.push(local.buffer, name, bytes); directory.push(central.buffer, name);
    offset += 30 + name.length + bytes.length; dirSize += 46 + name.length;
  }
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, dirSize, true); end.setUint32(16, offset, true);
  return new Blob([...files, ...directory, end.buffer], { type: 'application/zip' });
}
async function pack(format) {
  const entries = [], collection = structuredClone(cards);
  for (const [i, card] of collection.entries()) {
    for (const side of ['front', 'back']) {
      const svg = art(card, side);
      const bytes = format === 'png' ? new Uint8Array(await (await png(svg)).arrayBuffer()) : encoder.encode(svg);
      entries.push({ filename: `${String(i + 1).padStart(2, '0')}-${basename(card)}-${side}.${format}`, bytes });
    }
  }
  return zip(entries);
}

async function runDownload(button, action) {
  if (busy) return;
  busy = true; button.disabled = true;
  toast('exporting');
  try { await action(); toast('ready'); }
  catch { toast('exportError'); }
  finally { busy = false; button.disabled = false; }
}
function showExport() {
  const card = cardNow();
  if (!card) return;
  modalOpen('export', `<p class="modal-description">${escapeHTML(t('exportHint'))}</p>` +
    selectField('export-side', 'exportSide', view === 'both' ? editSide : view, ['front', 'back']) +
    `<div class="modal-options">${modalOption('png', 'PNG', 'pngDesc', 'photo')}${modalOption('svg', 'SVG', 'svgDesc', 'star')}</div>` +
    `<div class="field"><label for="zip-format">${escapeHTML(t('zipFormat'))}</label><select id="zip-format"><option value="svg">SVG</option><option value="png">PNG</option></select></div>` +
    `<div class="modal-buttons">${modalButton('zip', 'zip', true)}</div>`);
  $('#modal-body').onclick = event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const action = button.dataset.action;
    const side = $('#field-export-side').value, format = $('#zip-format').value;
    runDownload(button, async () => {
      if (action === 'zip') download(await pack(format), `Friendship-Cards-${format.toUpperCase()}.zip`);
      else {
        const content = art(card, side);
        download(action === 'png' ? await png(content) : content, `${basename(card)}-${side}.${action}`, 'image/svg+xml');
      }
    });
  };
}

function showProject() {
  modalOpen('project', `<div class="modal-options">${modalOption('json', 'jsonBackup', 'jsonDesc', 'folder')}${modalOption('html', 'htmlBackup', 'htmlDesc', 'download')}</div><p class="modal-description">${escapeHTML(t('publishNotice'))}</p>`);
  $('#modal-body').onclick = event => {
    const action = event.target.closest('[data-action]')?.dataset.action;
    if (action === 'json') download(JSON.stringify(currentDeck(), null, 2), 'Friendship-Studio-Backup.json', 'application/json');
    else if (action === 'html') {
      const state = JSON.stringify({ ...currentDeck(), projectId: id() }).replace(/</g, '\\u003c');
      const complete = sourceDocument.replace(/(<script id="studio-data" type="application\/json">)[\s\S]*?(<\/script>)/, (_, start, end) => start + state + end);
      download(complete, 'index.html', 'text/html;charset=utf-8');
    } else return;
    toast('ready');
  };
}

function readImport(text) {
  const studio = text.match(/<script\b[^>]*\bid=["']studio-data["'][^>]*>([\s\S]*?)<\/script>/i);
  const legacy = text.match(/<script\b[^>]*\bid=["']card-state["'][^>]*>([\s\S]*?)<\/script>/i);
  if (legacy) return legacyCards(JSON.parse(legacy[1]));
  const payload = JSON.parse(studio ? studio[1] : text.replace(/^\uFEFF/, ''));
  if (payload?.format !== PORTABLE_FORMAT || payload.version !== 2 || !Array.isArray(payload.cards)) throw new Error('Invalid backup');
  if (payload.cards.length > LIMIT) throw new Error('Too many cards');
  return payload.cards.map(cleanCard);
}
async function setImportedDimensions(card) {
  for (const photo of Object.values(card.photos)) {
    if (!photo) continue;
    try {
      const image = new Image(); image.src = photo.data;
      await image.decode(); photo.width = image.naturalWidth; photo.height = image.naturalHeight;
    } catch { throw new Error('Invalid embedded photo'); }
  }
}
async function importFile(file) {
  if (file.size > 75_000_000) { toast('uploadError'); return; }
  try {
    const incoming = readImport(await file.text());
    if (!incoming.length) throw new Error('Empty backup');
    for (const card of incoming) { await setImportedDimensions(card); card.id = id(); }
    modalOpen('importTitle', `<p class="modal-description">${incoming.length} ${escapeHTML(t('total'))}. ${escapeHTML(t('importConfirm'))}</p><div class="modal-buttons">${modalButton('cancel', 'cancel')}${modalButton('replace', 'replace')}${modalButton('append', 'append', true)}</div>`);
    $('#modal-body').onclick = event => {
      const action = event.target.closest('[data-action]')?.dataset.action;
      if (action === 'cancel') modal.close();
      if (action !== 'append' && action !== 'replace') return;
      if (action === 'append' && cards.length + incoming.length > LIMIT) { maxCards(); return; }
      cards = action === 'append' ? cards.concat(incoming) : incoming;
      modal.close();
      chooseCard(incoming[0]);
    };
  } catch { toast('importError'); }
}

function printSheets(selection = printSelection) {
  const collection = selection?.scope === 'allCards' ? cards : cardNow() ? [cardNow()] : [];
  const sides = selection?.sides || 'both';
  const pages = [];
  for (let start = 0; start < collection.length; start += 8) {
    const group = collection.slice(start, start + 8);
    for (const side of (sides === 'both' ? ['front', 'back'] : [sides])) {
      const mirror = side === 'back' && sides === 'both';
      const slots = group.map((card, index) => {
        const column = mirror ? 1 - index % 2 : index % 2, row = Math.floor(index / 2);
        return `<div class="print-card" style="top:${15 + 63 * row}mm;left:${12 + 100.4 * column}mm">${art(card, side)}</div>`;
      }).join('');
      pages.push(`<section class="print-sheet">${slots}<p class="print-note" dir="auto">${escapeHTML(t(side))} · A4 · 100% / Actual size${sides === 'both' ? ' · ' + escapeHTML(lang === 'ur' ? 'لمبے کنارے سے پلٹیں' : 'Flip on the long edge') : ''}</p></section>`);
    }
  }
  $('#print-output').innerHTML = pages.join('');
}
function showPrint() {
  modalOpen('print', `<p class="modal-description">${escapeHTML(t('printHint'))}</p>` +
    selectField('print-scope', 'printCards', 'selected', ['selected', 'allCards']) +
    selectField('print-sides', 'printSides', 'both', ['both', 'front', 'back']) + `<div class="modal-buttons">${modalButton('print', 'openPrint', true)}</div>`);
  $('#modal-body').onclick = event => {
    if (event.target.closest('[data-action]')?.dataset.action !== 'print') return;
    printSelection = { scope: $('#field-print-scope').value, sides: $('#field-print-sides').value };
    modal.close();
    printSheets();
    window.print();
  };
}
addEventListener('beforeprint', () => printSheets());
addEventListener('afterprint', () => { printSelection = undefined; $('#print-output').replaceChildren(); });

function wireControls() {
  $('#new-card').onclick = $('#library-add').onclick = showTemplates;
  $('#duplicate').onclick = duplicateCard;
  $('#delete').onclick = removeCard;
  $('#export').onclick = showExport;
  $('#print').onclick = showPrint;
  $('#project').onclick = showProject;
  $('#import').onclick = () => $('#import-file').click();
  $('#import-file').onchange = event => {
    const file = event.target.files[0]; event.target.value = '';
    if (file) importFile(file);
  };
  $('#language').onclick = () => {
    lang = lang === 'en' ? 'ur' : 'en';
    translate(); redraw(); scheduleSave(true);
  };
  $('#help').onclick = () => {
    modalOpen('help', `<ol class="help-list">${[1, 2, 3, 4].map(i => `<li>${escapeHTML(t('help' + i))}</li>`).join('')}</ol>`);
    $('#modal-body').onclick = null;
  };
  $('#library-list').onclick = event => {
    const cardId = event.target.closest('[data-card]')?.dataset.card;
    if (cardId === activeId) return;
    chooseCard(cards.find(card => card.id === cardId));
    $(`[data-card="${cardId}"]`)?.focus({ preventScroll: true });
  };
  $$('[data-view]').forEach(button => button.onclick = () => {
    view = button.dataset.view;
    if (view !== 'both') editSide = view;
    redrawPreview(); redrawEditor();
  });
  $$('[data-tab]').forEach(button => button.onclick = () => {
    tab = button.dataset.tab;
    redrawPreview(); redrawEditor();
  });
}

async function start() {
  let deck = embedded;
  try {
    database = await openDatabase();
    deck = (await storedDeck()) || embedded;
  } catch { database = null; }
  try { hydrate(deck); }
  catch { hydrate(embedded === deck ? null : embedded); }
  translate();
  wireControls();
  redraw();
  saveNow();
}
start();
